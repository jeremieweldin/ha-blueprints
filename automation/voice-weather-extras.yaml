blueprint:
  domain: automation
  name: Voice - Weather Extras - Local Assist
  author: Jeremie Weldin
  description: >-
    Quick weather answers from Assist, fully locally — the single piece of
    weather info you actually wanted, without the full forecast speech.


    ### Usage

    - what's the pressure / what's the barometric pressure

    - what's the humidity / how humid is it

    - what's the dew point

    - when does the sun rise [today|tomorrow] / what time is sunrise

    - when does the sun set [tonight|tomorrow] / what time is sunset


    For forecasts ("what's the weather tomorrow"), use a full forecast
    blueprint alongside this one.


    ### Units

    Pick US (pressure in inches of mercury) or metric (hectopascals).
    Whatever unit your weather entity reports pressure in is converted.
    Temperatures are spoken in the weather entity's own unit.


    Sunrise and sunset come from Home Assistant's built-in `sun.sun`.
  input:
    weather_entity:
      name: Weather entity
      description: The weather entity to read current conditions from.
      selector:
        entity:
          domain: weather
    units:
      name: Units
      selector:
        select:
          options:
            - label: US (inches of mercury)
              value: us
            - label: Metric (hectopascals)
              value: metric
      default: us
    pressure_trigger:
      name: Pressure sentences
      description: >-
        Sentences for every input below use plain words, [optional] parts
        and (one|two) alternatives — see "Notes on sentence triggers" in
        the README.
      selector:
        text:
          multiline: false
          multiple: true
      default:
        - "(what's|what is|whats) the pressure"
        - "(what's|what is|whats) the barometric pressure"
        - "barometric pressure"
        - "pressure"
    humidity_trigger:
      name: Humidity sentences
      selector:
        text:
          multiline: false
          multiple: true
      default:
        - "(what's|what is|whats) the humidity"
        - "how humid is it"
        - "humidity"
    dew_point_trigger:
      name: Dew point sentences
      selector:
        text:
          multiline: false
          multiple: true
      default:
        - "(what's|what is|whats) the dew point"
        - "dew point"
    sunrise_trigger:
      name: Sunrise sentences
      description: Include "tomorrow" as an option to let people ask about tomorrow.
      selector:
        text:
          multiline: false
          multiple: true
      default:
        - "when does the sun rise [today|tomorrow]"
        - "when is sunrise [tomorrow]"
        - "what time is sunrise [tomorrow]"
        - "what time does the sun rise [today|tomorrow]"
    sunset_trigger:
      name: Sunset sentences
      description: Include "tomorrow" as an option to let people ask about tomorrow.
      selector:
        text:
          multiline: false
          multiple: true
      default:
        - "when does the sun set [today|tonight|tomorrow]"
        - "when is sunset [tonight|tomorrow]"
        - "what time is sunset [tonight|tomorrow]"
        - "what time does the sun set [today|tonight|tomorrow]"
        - "(what's|what is|whats) [the] sunset [tonight]"

triggers:
  - id: pressure
    trigger: conversation
    command: !input pressure_trigger
  - id: humidity
    trigger: conversation
    command: !input humidity_trigger
  - id: dew_point
    trigger: conversation
    command: !input dew_point_trigger
  - id: sunrise
    trigger: conversation
    command: !input sunrise_trigger
  - id: sunset
    trigger: conversation
    command: !input sunset_trigger

variables:
  weather_entity: !input weather_entity
  units: !input units

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: pressure
        sequence:
          - set_conversation_response: >-
              {% set p = state_attr(weather_entity, 'pressure') %}
              {% set u = state_attr(weather_entity, 'pressure_unit') %}
              {% if p is none %}
              Sorry, I don't have the pressure right now.
              {% else %}
              {% set to_hpa = {'hPa': 1, 'mbar': 1, 'kPa': 10, 'Pa': 0.01, 'mmHg': 1.33322,
                               'inHg': 33.8639, 'psi': 68.9476} %}
              {% set hpa = (p | float(0)) * to_hpa.get(u, 1) %}
              {% if units == 'metric' %}
              The barometric pressure is {{ hpa | round(0) | int }} hectopascals.
              {% else %}
              The barometric pressure is {{ (hpa * 0.02953) | round(2) }} inches of mercury.
              {% endif %}
              {% endif %}

      - conditions:
          - condition: trigger
            id: humidity
        sequence:
          - set_conversation_response: >-
              {% set h = state_attr(weather_entity, 'humidity') %}
              {% if h is not none %}
              The humidity is {{ h | int }} percent.
              {% else %}
              Sorry, I don't have the humidity right now.
              {% endif %}

      - conditions:
          - condition: trigger
            id: dew_point
        sequence:
          - set_conversation_response: >-
              {% set d = state_attr(weather_entity, 'dew_point') %}
              {% set u = state_attr(weather_entity, 'temperature_unit') or '°' %}
              {% if d is not none %}
              The dew point is {{ d | round(1) }} degrees{% if u in ['°F', 'F'] %} Fahrenheit{% elif u in ['°C', 'C'] %} Celsius{% endif %}.
              {% else %}
              Sorry, I don't have the dew point right now.
              {% endif %}

      - conditions:
          - condition: trigger
            id: sunrise
        sequence:
          - set_conversation_response: >-
              {% set nr = state_attr('sun.sun', 'next_rising') %}
              {% if nr is none %}
              Sorry, I don't have sunrise data right now.
              {% else %}
              {% set t = as_datetime(nr) | as_local %}
              {% set wants_tomorrow = 'tomorrow' in (trigger.sentence | default('')) | lower %}
              {% if wants_tomorrow and t.date() == now().date() %}
              {% set t = t + timedelta(days=1) %}
              {% endif %}
              {% set day = 'today' if t.date() == now().date() else 'tomorrow' if t.date() == (now() + timedelta(days=1)).date() else t.strftime('%A') %}
              {% set h = t.strftime('%I') | int %}
              {% set m = t.minute %}
              {% set tod = 'in the morning' if t.hour < 12 else 'in the afternoon' if t.hour < 18 else 'in the evening' %}
              The sun rises {{ day }} at {{ h }}{% if m > 0 %}:{{ '%02d' % m }}{% endif %} {{ tod }}.
              {% endif %}

      - conditions:
          - condition: trigger
            id: sunset
        sequence:
          - set_conversation_response: >-
              {% set ns = state_attr('sun.sun', 'next_setting') %}
              {% if ns is none %}
              Sorry, I don't have sunset data right now.
              {% else %}
              {% set t = as_datetime(ns) | as_local %}
              {% set wants_tomorrow = 'tomorrow' in (trigger.sentence | default('')) | lower %}
              {% if wants_tomorrow and t.date() == now().date() %}
              {% set t = t + timedelta(days=1) %}
              {% endif %}
              {% set day = 'tonight' if t.date() == now().date() else 'tomorrow' if t.date() == (now() + timedelta(days=1)).date() else t.strftime('%A') %}
              {% set h = t.strftime('%I') | int %}
              {% set m = t.minute %}
              {% set tod = 'in the morning' if t.hour < 12 else 'in the afternoon' if t.hour < 18 else 'in the evening' %}
              The sun sets {{ day }} at {{ h }}{% if m > 0 %}:{{ '%02d' % m }}{% endif %} {{ tod }}.
              {% endif %}

mode: parallel
max: 5
